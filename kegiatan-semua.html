<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semua Kegiatan — Sekola Konang Indonesia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  :root { --bg:#0a1219; --panel:#111a22; --line:#25333f; --text:#e8eef2; --soft:#9fb0bd; --lime:#ccff00; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:1180px; margin:0 auto; padding:28px 5% 70px; }
  .back { display:inline-flex; gap:8px; align-items:center; color:var(--soft); text-decoration:none; font-size:.85rem; margin-bottom:18px; }
  .back:hover { color:var(--lime); }
  h1 { font-size:2rem; margin-bottom:8px; } .sub { color:var(--soft); line-height:1.7; max-width:720px; margin-bottom:24px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:24px; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--soft); border-radius:50px; padding:8px 16px; font:inherit; font-size:.82rem; cursor:pointer; }
  .chip.on { background:var(--lime); color:#111; border-color:var(--lime); font-weight:700; }
  select, input { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:9px 12px; font:inherit; font-size:.85rem; }
  input { flex:1; min-width:180px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; text-decoration:none; color:inherit; display:flex; flex-direction:column; transition:.25s; }
  .card:hover { transform:translateY(-6px); border-color:var(--lime); box-shadow:0 0 18px rgba(204,255,0,.25); }
  .card img { width:100%; aspect-ratio:16/10; object-fit:cover; background:#000; }
  .cb { padding:16px 18px 20px; display:flex; flex-direction:column; gap:8px; }
  .tags { display:flex; gap:6px; } .tag { font-size:.62rem; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--lime); border:1px solid var(--lime); border-radius:50px; padding:2px 10px; }
  .tag.d { color:var(--soft); border-color:var(--line); }
  .card h3 { font-size:1rem; line-height:1.35; } .card p { font-size:.85rem; line-height:1.6; color:var(--soft); }
  .empty { color:var(--soft); padding:40px 0; text-align:center; }
  @media (max-width:900px) { .grid { grid-template-columns:repeat(2,1fr); } } @media (max-width:560px) { .grid { grid-template-columns:1fr; } h1 { font-size:1.6rem; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html#kegiatan"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
  <h1>Semua Kegiatan Kami</h1>
  <p class="sub">Penanaman, pemantauan keanekaragaman hayati, dan kegiatan lain yang kami jalankan bersama warga dan mitra. Pilih yang ingin kamu lihat.</p>
  <div class="bar">
    <button class="chip on" data-j="">Semua</button>
    <button class="chip" data-j="penanaman">Penanaman</button>
    <button class="chip" data-j="biodiversitas">Biodiversitas</button>
    <button class="chip" data-j="lainnya">Lainnya</button>
    <select id="tahun"><option value="">Semua tahun</option></select>
    <input id="cari" type="search" placeholder="Cari kegiatan…">
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" style="display:none">Belum ada kegiatan yang cocok.</p>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  const db = getFirestore(initializeApp({
    apiKey: "AIzaSyAepuZ8RHHuizqvXCbvBn4jyLxuWxwGey0", authDomain: "sekola-konang.firebaseapp.com", projectId: "sekola-konang",
    storageBucket: "sekola-konang.firebasestorage.app", messagingSenderId: "9338352073", appId: "1:9338352073:web:b56481b836888b1a8bf818"
  }));
  const JENIS = { penanaman:'Penanaman', biodiversitas:'Biodiversitas', lainnya:'Kegiatan' };
  let semua = [], jenis = '';
  const $ = id => document.getElementById(id);
  function gambar() {
    const th = $('tahun').value, q = $('cari').value.trim().toLowerCase();
    const arr = semua.filter(k => (!jenis || k.jenis === jenis) && (!th || String(k.tahun) === th) && (!q || (k.judul + ' ' + k.ringkas).toLowerCase().includes(q)));
    const g = $('grid'); g.innerHTML = '';
    arr.forEach(k => {
      const a = document.createElement('a'); a.className = 'card'; a.href = 'kegiatan.html?id=' + encodeURIComponent(k.id);
      if (k.cover) { const im = document.createElement('img'); im.src = k.cover; im.alt = ''; a.appendChild(im); }
      const b = document.createElement('div'); b.className = 'cb';
      const t = document.createElement('div'); t.className = 'tags';
      const t1 = document.createElement('span'); t1.className = 'tag'; t1.textContent = JENIS[k.jenis] || 'Kegiatan'; t.appendChild(t1);
      if (k.tahun) { const t2 = document.createElement('span'); t2.className = 'tag d'; t2.textContent = k.tahun; t.appendChild(t2); }
      const h = document.createElement('h3'); h.textContent = k.judul || '';
      const p = document.createElement('p'); p.textContent = k.ringkas || '';
      b.append(t, h, p); a.appendChild(b); g.appendChild(a);
    });
    $('empty').style.display = arr.length ? 'none' : 'block';
  }
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { document.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); jenis = c.dataset.j; gambar(); });
  $('tahun').onchange = gambar; $('cari').oninput = gambar;
  try {
    const s = await getDocs(collection(db, 'kegiatan_unggulan'));
    s.forEach(d => { const x = d.data(); if (x.tampil) semua.push({ id:d.id, ...x }); });
    semua.sort((a, b) => (b.tahun || 0) - (a.tahun || 0) || (a.urutan || 0) - (b.urutan || 0));
    [...new Set(semua.map(k => k.tahun).filter(Boolean))].sort((a, b) => b - a).forEach(y => { const o = document.createElement('option'); o.value = y; o.textContent = y; $('tahun').appendChild(o); });
  } catch (e) { console.error(e); }
  gambar();
</script>
</body>
</html>
