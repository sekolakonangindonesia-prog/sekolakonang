<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>Berita - SMIPRO STREETART.ID</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
    /* ============ STYLE KHUSUS HALAMAN DETAIL BERITA ============ */
    body { background: #0a0a0a; }

    .news-detail-nav {
        background: #000;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 999;
        border-bottom: 1px solid var(--border, #1e1e1e);
    }
    .news-detail-brand {
        display: flex; align-items: center; gap: 10px;
        text-decoration: none; color: #fff; font-weight: 800; letter-spacing: 1px;
        font-size: 0.95rem;
    }
    .news-detail-brand img { height: 32px; }
    .btn-kembali-news {
        background: none;
        border: 1px solid #333;
        color: #ccc;
        padding: 7px 16px;
        border-radius: 30px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: 0.2s;
        display: flex; align-items: center; gap: 6px;
    }
    .btn-kembali-news:hover { border-color: var(--accent, #c6ff00); color: var(--accent, #c6ff00); }

    .article-wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 30px 20px 60px;
    }

    .article-hero-img {
        width: 100%;
        aspect-ratio: 16/9;
        object-fit: cover;
        border-radius: 14px;
        margin-bottom: 24px;
        background: #111;
        border: 1px solid #1e1e1e;
    }

    .article-tag-badge {
        display: inline-block;
        background: rgba(198,255,0,0.12);
        color: var(--accent, #c6ff00);
        border: 1px solid rgba(198,255,0,0.3);
        padding: 4px 14px;
        border-radius: 99px;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 14px;
    }

    .article-heading {
        font-size: clamp(1.5rem, 5vw, 2.2rem);
        font-weight: 800;
        color: #fff;
        line-height: 1.25;
        margin: 0 0 16px;
    }

    .article-meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        color: #888;
        font-size: 0.82rem;
        border-bottom: 1px solid #1e1e1e;
        padding-bottom: 20px;
        margin-bottom: 28px;
    }
    .article-meta-row span { display: flex; align-items: center; gap: 6px; }
    .article-meta-row i { color: var(--accent, #c6ff00); }

    .article-content {
        font-size: 1.05rem;
        line-height: 1.85;
        color: #dcdcdc;
        font-family: 'Segoe UI', sans-serif;
    }
    .article-content p { margin: 0 0 20px; }

    .article-share {
        margin-top: 44px;
        padding-top: 22px;
        border-top: 1px solid #1e1e1e;
    }
    .article-share small { color: #777; }
    .share-btn-dark {
        margin-top: 12px;
        padding: 9px 16px;
        border-radius: 30px;
        border: 1px solid #333;
        background: #141414;
        color: #ddd;
        cursor: pointer;
        margin-right: 10px;
        font-size: 0.82rem;
        transition: 0.2s;
    }
    .share-btn-dark:hover { border-color: var(--accent, #c6ff00); color: var(--accent, #c6ff00); }

    .state-box {
        text-align: center;
        padding: 90px 20px;
        color: #666;
    }
    .state-box i { font-size: 1.8rem; color: var(--accent, #c6ff00); margin-bottom: 14px; display: block; }
    .state-box h2 { color: #ccc; font-size: 1.1rem; margin: 10px 0 6px; }
    .state-box a { color: var(--accent, #c6ff00); text-decoration: none; font-weight: 600; }

    @media (max-width: 600px) {
        .article-wrap { padding: 20px 16px 50px; }
    }
</style>
</head>
<body>

<nav class="news-detail-nav">
    <a href="index.html" class="news-detail-brand">
        <img src="https://raw.githubusercontent.com/sekolakonangindonesia-prog/smipro-streetart/main/Logo_Stretart.png" alt="Logo">
        SUARA & SOROT MEDIA
    </a>
    <button class="btn-kembali-news" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i> Kembali
    </button>
</nav>

<div class="article-wrap" id="news-content-area">
    <div class="state-box">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        Memuat berita...
    </div>
</div>

<script type="module">
    import { db } from './firebase-config.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const area = document.getElementById('news-content-area');

    async function loadNewsDetail() {
        if (!id) {
            window.location.href = 'index.html';
            return;
        }
        try {
            const docRef = doc(db, "news", id);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();

                // Jika berita ini sumbernya media luar, arahkan langsung ke sumbernya
                if (data.type === 'external' && data.url) {
                    window.location.href = data.url;
                    return;
                }

                const formattedBody = (data.content || '')
                    .split('\n')
                    .filter(p => p.trim() !== '')
                    .map(p => `<p>${p}</p>`)
                    .join('');

                area.innerHTML = `
                    <span class="article-tag-badge">${data.tag || 'BERITA INTERNAL'}</span>
                    <h1 class="article-heading">${data.title || 'Tanpa Judul'}</h1>
                    <div class="article-meta-row">
                        <span><i class="fa-regular fa-calendar"></i> ${data.date || '-'}</span>
                        <span><i class="fa-solid fa-pen-nib"></i> Tim Redaksi SMIPRO</span>
                    </div>
                    ${data.thumb ? `<img src="${data.thumb}" class="article-hero-img" onerror="this.style.display='none'">` : ''}
                    <div class="article-content">
                        ${formattedBody || '<p>Konten berita belum tersedia.</p>'}
                    </div>
                    <div class="article-share">
                        <small>Bagikan berita ini:</small><br>
                        <button class="share-btn-dark" onclick="shareWA()"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
                        <button class="share-btn-dark" onclick="copyLink()"><i class="fa-solid fa-link"></i> Salin Link</button>
                    </div>
                `;
                document.title = (data.title || 'Berita') + " - SMIPRO STREETART.ID";
            } else {
                area.innerHTML = `
                    <div class="state-box">
                        <i class="fa-solid fa-newspaper"></i>
                        <h2>Berita tidak ditemukan</h2>
                        <p>Berita ini mungkin telah dihapus atau ID tidak valid.</p>
                        <a href="index.html">Kembali ke Beranda &rarr;</a>
                    </div>`;
            }
        } catch (e) {
            console.error("Gagal memuat berita:", e);
            area.innerHTML = `
                <div class="state-box">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <h2>Gagal memuat berita</h2>
                    <p>Terjadi kendala koneksi. Silakan coba lagi.</p>
                    <a href="index.html">Kembali ke Beranda &rarr;</a>
                </div>`;
        }
    }

    window.goBack = function () {
        if (document.referrer && document.referrer.includes(window.location.host) && window.history.length > 1) {
            history.back();
        } else {
            window.location.href = 'index.html';
        }
    };

    window.shareWA = function () {
        const url = window.location.href;
        window.open(`https://wa.me/?text=${encodeURIComponent("Baca berita ini di SMIPRO: " + url)}`, '_blank');
    };

    window.copyLink = function () {
        navigator.clipboard.writeText(window.location.href);
        alert("Link tersalin!");
    };

    loadNewsDetail();
</script>

</body>
</html>
