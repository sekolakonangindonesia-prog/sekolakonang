<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berita - Yayasan Sekola Konang Indonesia</title>

<!-- Library CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
    :root { --accent: #c6ff00; --dark: #050505; --card-bg: #121212; --sk-orange: #ffab00; }
    body { font-family: 'Montserrat', sans-serif; background-color: var(--dark); color: #eee; padding-bottom: 50px; }

    /* --- NAV --- */
    .navbar-article {
        background: rgba(5,5,5,0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(198,255,0,0.15);
        padding: 14px 0;
    }
    .navbar-article .brand-link { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .navbar-article img { height: 34px; }
    .navbar-article .brand-text strong { display:block; color:#fff; font-size:0.82rem; letter-spacing:0.3px; }
    .navbar-article .brand-text small { display:block; color:var(--accent); font-size:0.55rem; letter-spacing:2px; text-transform:uppercase; font-weight:700; }
    .btn-back-article {
        background:#1a1a1a; color:#ccc; border:1px solid #333;
        padding:8px 20px; border-radius:50px; font-weight:700; font-size:0.68rem;
        text-transform:uppercase; transition:0.3s; text-decoration:none;
    }
    .btn-back-article:hover { color:var(--accent); border-color:var(--accent); }

    /* --- ARTICLE --- */
    .article-wrap { max-width: 800px; margin: 0 auto; padding: 44px 20px 20px; }

    .type-badge-article {
        display:inline-block; font-size:0.62rem; font-weight:800;
        padding:5px 14px; border-radius:50px; text-transform:uppercase;
        letter-spacing:1px; margin-bottom:16px;
    }
    .bg-internal { background: var(--accent); color: black; }
    .bg-external { background: #0277bd; color: white; }

    .article-title {
        font-weight: 900; font-size: clamp(1.5rem, 4.5vw, 2.4rem);
        line-height: 1.3; color: #fff; margin-bottom: 18px;
    }

    .article-meta {
        display:flex; flex-wrap:wrap; gap:18px;
        color:#777; font-size:0.78rem; font-weight:600;
        border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 30px;
    }
    .article-meta span { display:flex; align-items:center; gap:6px; }
    .article-meta i { color: var(--accent); }

    .article-hero-img {
        width:100%; max-height:420px; object-fit:cover;
        border-radius:20px; margin-bottom:30px;
        border:1px solid #222; background:#111;
    }

    .article-body {
        font-size: 1.02rem; line-height: 1.9; color: #ccc;
    }
    .article-body p { margin-bottom: 20px; }

    .share-area {
        margin-top: 46px; padding-top: 22px; border-top: 1px solid #222;
    }
    .share-area small { color:#666; font-weight:600; text-transform:uppercase; letter-spacing:1px; font-size:0.65rem; }
    .btn-share {
        margin-top: 12px; margin-right: 10px;
        background:#1a1a1a; border:1px solid #333; color:#ddd;
        padding: 9px 18px; border-radius: 50px; font-size:0.75rem; font-weight:700;
        transition: 0.3s;
    }
    .btn-share:hover { border-color: var(--accent); color: var(--accent); }

    .state-box { text-align:center; padding: 90px 20px; color:#555; }
    .state-box i { font-size: 1.8rem; color: var(--accent); margin-bottom: 14px; display:block; }
    .state-box h2 { color:#ccc; font-size: 1.05rem; margin: 8px 0 6px; }
    .state-box a { color: var(--accent); text-decoration:none; font-weight: 700; font-size:0.85rem; }

    .footer-sk { text-align: center; margin-top: 70px; font-size: 0.6rem; font-weight: 700; letter-spacing: 3px; opacity: 0.3; text-transform: uppercase; }

    @media (max-width: 600px) {
        .article-wrap { padding: 30px 16px 20px; }
    }
</style>
</head>
<body>

<nav class="navbar-article">
    <div class="container d-flex align-items-center justify-content-between">
        <a href="index.html" class="brand-link">
            <img src="https://raw.githubusercontent.com/sekolakonangindonesia-prog/sekolakonang/refs/heads/main/LOGO%20YSKI.png" alt="Logo YSKI">
            <div class="brand-text">
                <strong>Sekola Konang</strong>
                <small>Konang News</small>
            </div>
        </a>
        <button class="btn-back-article" onclick="goBack()">
            <i class="fas fa-arrow-left"></i> Kembali
        </button>
    </div>
</nav>

<div class="container">
    <div class="article-wrap" id="articleArea">
        <div class="state-box">
            <i class="fas fa-circle-notch fa-spin"></i>
            Memuat berita...
        </div>
    </div>
    <div class="footer-sk">@ Yayasan Sekola Konang Indonesia</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAepuZ8RHHuizqvXCbvBn4jyLxuWxwGey0",
    authDomain: "sekola-konang.firebaseapp.com",
    projectId: "sekola-konang",
    storageBucket: "sekola-konang.firebasestorage.app",
    messagingSenderId: "9338352073",
    appId: "1:9338352073:web:b56481b836888b1a8bf818"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function esc(str) { return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const area = document.getElementById('articleArea');

async function loadArticle() {
    if (!id) {
        window.location.href = 'news.html';
        return;
    }
    try {
        const snap = await getDoc(doc(db, "news", id));

        if (!snap.exists()) {
            area.innerHTML = `
                <div class="state-box">
                    <i class="fas fa-newspaper"></i>
                    <h2>Berita tidak ditemukan</h2>
                    <p style="font-size:0.85rem;">Berita ini mungkin telah dihapus atau ID tidak valid.</p>
                    <a href="news.html">&larr; Kembali ke Daftar Berita</a>
                </div>`;
            return;
        }

        const d = snap.data();

        // Kalau ternyata berita eksternal, langsung arahkan ke sumbernya
        if (d.type === 'external' && (d.url || d.link)) {
            window.location.href = d.url || d.link;
            return;
        }

        const rawContent = d.content || d.excerpt || '';
        const formattedBody = rawContent
            .split('\n')
            .filter(p => p.trim() !== '')
            .map(p => `<p>${esc(p)}</p>`)
            .join('');

        area.innerHTML = `
            <span class="type-badge-article bg-internal">Internal</span>
            <h1 class="article-title">${esc(d.title || 'Tanpa Judul')}</h1>
            <div class="article-meta">
                <span><i class="far fa-calendar"></i> ${esc(d.date || '-')}</span>
                <span><i class="fas fa-pen-nib"></i> Tim Redaksi Sekola Konang</span>
            </div>
            ${d.image ? `<img src="${esc(d.image)}" class="article-hero-img" onerror="this.style.display='none'">` : ''}
            <div class="article-body">
                ${formattedBody || '<p>Konten berita belum tersedia.</p>'}
            </div>
            <div class="share-area">
                <small>Bagikan berita ini</small><br>
                <button class="btn-share" onclick="shareWA()"><i class="fab fa-whatsapp"></i> WhatsApp</button>
                <button class="btn-share" onclick="copyLink()"><i class="fas fa-link"></i> Salin Link</button>
            </div>
        `;
        document.title = (d.title || 'Berita') + " - Konang News";

    } catch (e) {
        console.error("Gagal memuat berita:", e);
        area.innerHTML = `
            <div class="state-box">
                <i class="fas fa-triangle-exclamation"></i>
                <h2>Gagal memuat berita</h2>
                <p style="font-size:0.85rem;">Terjadi kendala koneksi. Silakan coba lagi.</p>
                <a href="news.html">&larr; Kembali ke Daftar Berita</a>
            </div>`;
    }
}

window.goBack = function () {
    if (document.referrer && document.referrer.includes(window.location.host) && window.history.length > 1) {
        history.back();
    } else {
        window.location.href = 'news.html';
    }
};

window.shareWA = function () {
    const url = window.location.href;
    window.open(`https://wa.me/?text=${encodeURIComponent("Baca berita ini di Sekola Konang: " + url)}`, '_blank');
};

window.copyLink = function () {
    navigator.clipboard.writeText(window.location.href);
    alert("Link tersalin!");
};

loadArticle();
</script>

</body>
</html>
